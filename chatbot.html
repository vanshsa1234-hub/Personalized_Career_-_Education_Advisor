<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Path Finder - Career Guidance</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        :root {
            --primary-color: #4A90E2;
            --secondary-color: #50E3C2;
            --background-color: #F4F7FC;
            --card-background: #FFFFFF;
            --text-color: #333333;
            --text-light: #666666;
            --border-color: #E0E0E0;
            --shadow-light: rgba(0, 0, 0, 0.05);
            --shadow-medium: rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-y: auto;
        }

        .container {
            background-color: var(--card-background);
            border-radius: 15px;
            box-shadow: 0 10px 30px var(--shadow-medium);
            width: 90%;
            max-width: 800px;
            padding: 30px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            margin: 20px 0;
            min-height: 80vh; /* Ensure it's tall enough */
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            font-size: 2.5em;
            color: var(--primary-color);
            margin: 0;
            font-weight: 600;
        }

        header p {
            font-size: 1.1em;
            color: var(--text-light);
            margin-top: 5px;
        }

        .chat-window {
            flex-grow: 1;
            background-color: var(--background-color);
            border-radius: 10px;
            padding: 20px;
            overflow-y: auto;
            margin-bottom: 20px;
            max-height: calc(80vh - 200px); /* Adjust based on header/input height */
            box-shadow: inset 0 2px 5px var(--shadow-light);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--primary-color);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 600;
            flex-shrink: 0;
        }

        .message.bot .avatar {
            background-color: var(--secondary-color);
        }

        .message .content {
            background-color: var(--card-background);
            padding: 12px 18px;
            border-radius: 18px;
            max-width: 70%;
            box-shadow: 0 2px 8px var(--shadow-light);
            word-wrap: break-word;
            line-height: 1.6;
        }

        .message.user .content {
            background-color: var(--primary-color);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.bot .content {
            background-color: #E6F3FF; /* Light blue for bot */
            color: var(--text-color);
            border-bottom-left-radius: 4px;
        }

        .input-area {
            display: flex;
            gap: 15px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .input-area input[type="text"] {
            flex-grow: 1;
            padding: 15px 20px;
            border: 1px solid var(--border-color);
            border-radius: 25px;
            font-size: 1em;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .input-area input[type="text"]:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.2);
        }

        .input-area button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 25px;
            padding: 15px 25px;
            font-size: 1em;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-area button:hover {
            background-color: #3A7ADF;
            transform: translateY(-2px);
        }

        .input-area button:active {
            transform: translateY(0);
        }

        .input-area button svg {
            fill: white;
            width: 20px;
            height: 20px;
        }

        .loading-indicator {
            text-align: center;
            margin-top: 10px;
            font-style: italic;
            color: var(--text-light);
            display: none; /* Hidden by default */
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            .container {
                width: 95%;
                padding: 20px;
                min-height: 90vh;
            }

            header h1 {
                font-size: 2em;
            }

            .chat-window {
                max-height: calc(90vh - 180px);
                padding: 15px;
            }

            .message .content {
                max-width: 85%;
                padding: 10px 15px;
                font-size: 0.9em;
            }

            .input-area {
                flex-direction: column;
                gap: 10px;
            }

            .input-area input[type="text"],
            .input-area button {
                width: 100%;
                box-sizing: border-box;
            }

            .input-area button {
                padding: 12px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Path Finder</h1>
            <p>Your AI Career Guidance Instructor for JEE, NEET, UPSC, CAT, SSC.</p>
        </header>

        <div class="chat-window" id="chatWindow">
            <div class="message bot">
                <div class="avatar">AI</div>
                <div class="content">Hello! I'm your career guidance instructor. How can I help you today with your JEE, NEET, UPSC, CAT, or SSC queries?</div>
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Ask about JEE, NEET, UPSC, CAT, SSC, or career paths...">
            <button id="sendBtn">
                Send
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
            </button>
        </div>
        <div class="loading-indicator" id="loadingIndicator">Path Finder is thinking...</div>
    </div>

    <script type="module">
        const chatWindow = document.getElementById('chatWindow');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const loadingIndicator = document.getElementById('loadingIndicator');

        async function sendMessageToAI(message) {
            loadingIndicator.style.display = 'block';
            try {
                const response = await fetch('http://localhost:3001/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
                const data = await response.json();
                return data.text;
            } catch (error) {
                console.error("Error sending message to AI:", error);
                return "An error occurred while fetching the response. Please check your network and try again.";
            } finally {
                loadingIndicator.style.display = 'none';
            }
        }


        function addMessage(sender, text) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);

            const avatarDiv = document.createElement('div');
            avatarDiv.classList.add('avatar');
            avatarDiv.textContent = sender === 'user' ? 'You' : 'AI';

            const contentDiv = document.createElement('div');
            contentDiv.classList.add('content');
            contentDiv.innerHTML = formatText(text); // Use innerHTML to render newlines and bold

            messageDiv.appendChild(avatarDiv);
            messageDiv.appendChild(contentDiv);
            chatWindow.appendChild(messageDiv);

            chatWindow.scrollTop = chatWindow.scrollHeight; // Auto-scroll to latest message
        }

        // Simple function to format text, e.g., for newlines
        function formatText(text) {
            return text.replace(/\n/g, '<br>');
        }

        async function handleUserInput() {
            const message = userInput.value.trim();
            if (message === '') return;

            addMessage('user', message);
            userInput.value = ''; // Clear input field

            const aiResponse = await sendMessageToAI(message);
            addMessage('bot', aiResponse);
        }

        sendBtn.addEventListener('click', handleUserInput);

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleUserInput();
            }
        });

        // Initial welcome message (already in HTML)
    </script>
</body>
</html>
